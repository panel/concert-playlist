name: Concert Playlist Update

on:
  schedule:
    # Every Monday at 2pm UTC — 9am Chicago during daylight time, 8am during
    # standard time (GitHub cron is fixed UTC and does not track DST).
    - cron: '0 14 * * 1'
  workflow_dispatch: # Allow manual run from GitHub UI

permissions:
  contents: write # the workflow commits the regenerated docs/ site

jobs:
  update-playlist:
    name: Discover concerts and update Spotify playlist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run agent
        run: node dist/agent.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Commit updated site
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Update concert site ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No site changes to commit"
          fi
